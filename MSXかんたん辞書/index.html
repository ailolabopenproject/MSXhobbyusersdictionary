<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSX資料辞書</title>
<style>
:root{--bg:#0b1220;--panel:#121d30;--panel2:#17253b;--text:#edf4ff;--muted:#9fb1ca;--line:#2a3b55;--accent:#6ee7e0;--accent2:#8bb7ff;--danger:#ff8d9b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#09101c,#101b2d 60%,#101a28);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:28px max(18px,calc((100% - 1180px)/2));border-bottom:1px solid var(--line);background:#0b1422dd}
.kicker{color:var(--accent);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase}h1{margin:.25rem 0;font-size:clamp(1.6rem,4vw,2.4rem)}header p{margin:.3rem 0 0;color:var(--muted)}
main{max-width:1180px;margin:auto;padding:22px 18px 56px}.toolbar,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 12px 30px #0002}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.search{width:100%;padding:13px 15px;border-radius:10px;border:1px solid var(--line);background:#091321;color:var(--text);font-size:1rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:var(--panel2);color:var(--text);cursor:pointer;font-weight:650}.btn:hover{border-color:var(--accent2)}.primary{background:var(--accent);border-color:var(--accent);color:#07151b}.danger{color:var(--danger)}
.stats{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.9rem;margin-top:12px}.stats strong{color:var(--text)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}.records{display:grid;gap:10px}.record{border:1px solid var(--line);background:linear-gradient(135deg,#132139,#101a2b);border-radius:14px;padding:16px}.record h3{margin:0 0 5px;font-size:1.08rem}.record .meta{color:var(--accent2);font-size:.82rem}.record p{margin:8px 0;color:#d2ddef;white-space:pre-wrap;overflow-wrap:anywhere}.record .links{display:flex;gap:10px;flex-wrap:wrap;font-size:.9rem}.record a{color:var(--accent)}.record .rec-actions{display:flex;gap:7px;margin-top:12px}.muted{color:var(--muted)}.empty{text-align:center;padding:44px 18px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
label{display:block;font-size:.87rem;color:var(--muted);margin:11px 0 5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#091321;color:var(--text);padding:10px 11px;font:inherit}textarea{min-height:75px;resize:vertical}.form-actions{display:flex;gap:8px;margin-top:14px}.form-actions button{flex:1}.side-title{margin:0 0 4px}.hint{font-size:.84rem;color:var(--muted)}.notice{border-left:3px solid var(--accent);padding:10px 12px;background:#0d2930;border-radius:6px;color:#d4f9f6;font-size:.88rem;margin-top:12px}.hidden{display:none!important}.file-label{display:inline-flex;align-items:center}
footer{max-width:1180px;margin:auto;padding:0 18px 26px;color:var(--muted);font-size:.82rem}
@media(max-width:820px){.toolbar{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.side{order:-1}.actions .btn{flex:1}.record{padding:13px}}
</style>
</head>
<body>
<header><div class="kicker">MSX · PERSONAL KNOWLEDGE BASE</div><h1>MSX資料辞書</h1><p>パーツ・規格・互換情報を、探して、記録して、育てる。</p></header>
<main>
  <section class="toolbar">
    <div><input id="search" class="search" placeholder="名称・分類・型番・互換品・備考などで検索…" autocomplete="off"><div class="stats"><span>登録件数 <strong id="count">0</strong></span><span>表示件数 <strong id="shown">0</strong></span><span id="storageStatus">このブラウザに保存</span></div></div>
    <div class="actions">
      <button class="btn primary" id="newBtn">＋ 新規登録</button>
      <label class="btn file-label" for="excelFile" style="margin:0;color:var(--text)">Excel取込</label><input id="excelFile" type="file" accept=".xlsx,.xls,.csv" class="hidden">
      <button class="btn" id="exportBtn">CSV書出</button>
      <button class="btn" id="backupBtn">JSONバックアップ</button>
      <label class="btn file-label" for="jsonFile" style="margin:0;color:var(--text)">復元</label><input id="jsonFile" type="file" accept=".json" class="hidden">
    </div>
  </section>
  <div class="layout">
    <section><div id="records" class="records"></div></section>
    <aside class="panel side" id="editorPanel">
      <h2 class="side-title" id="formTitle">新しい情報を登録</h2>
      <p class="hint">項目を入力して保存してください。名称は必須です。</p>
      <form id="recordForm">
        <input type="hidden" id="recordId">
        <label for="name">名称 *</label><input id="name" required maxlength="200" placeholder="例：MSX用メモリ">
        <label for="category">分類</label><input id="category" placeholder="例：メモリ / 電源 / 周辺機器">
        <label for="spec">規格</label><input id="spec" placeholder="例：DRAM、電圧など">
        <label for="model">型番・別名</label><input id="model">
        <label for="compatible">互換品</label><input id="compatible">
        <label for="supplier">入手先</label><input id="supplier">
        <label for="notes">備考</label><textarea id="notes"></textarea>
        <label for="source">出典URL</label><input id="source" type="url" placeholder="https://…">
        <div class="form-actions"><button class="btn primary" type="submit">保存</button><button class="btn" type="button" id="clearBtn">クリア</button></div>
        <button class="btn danger hidden" type="button" id="deleteBtn" style="width:100%;margin-top:8px">このデータを削除</button>
      </form>
      <div class="notice">保存先は現在のブラウザ内です。端末・ブラウザを変える前に、JSONバックアップを保存してください。</div>
    </aside>
  </div>
</main>
<footer>試作版 0.1 · 個人用データベース · Excel取込は「名称 / 分類 / 規格 / 型番・別名 / 互換品 / 入手先 / 備考 / 出典URL」の列見出しを推奨します。</footer>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const FIELDS = [
  ["name","名称"],["category","分類"],["spec","規格"],["model","型番・別名"],
  ["compatible","互換品"],["supplier","入手先"],["notes","備考"],["source","出典URL"]
];
const KEY="msx-dictionary-records-v1";
let records=[];
const $=id=>document.getElementById(id);
function uid(){return "msx-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)}
function cleanRecord(row){
  const out={id:row.id||uid()};
  const aliases={
    name:["名称","name","Name","名称・品名"],category:["分類","category","Category"],
    spec:["規格","spec","仕様"],model:["型番・別名","型番","別名","model","型番/別名"],
    compatible:["互換品","互換","compatible"],supplier:["入手先","購入先","入手方法","supplier"],
    notes:["備考","メモ","notes"],source:["出典URL","出典","URL","source","出典 url"]
  };
  for(const [key] of FIELDS){
    let value=row[key];
    if(value===undefined || value===null || value===""){
      const found=Object.keys(row).find(k=>aliases[key].some(a=>k.trim().toLowerCase()===a.toLowerCase()));
      value=found?row[found]:"";
    }
    out[key]=String(value??"").trim();
  }
  return out;
}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"[]");records=Array.isArray(x)?x.map(cleanRecord):[]}catch{records=[]}}
function persist(){localStorage.setItem(KEY,JSON.stringify(records));render()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
  const q=$("search").value.trim().toLowerCase();
  const filtered=records.filter(r=>FIELDS.some(([k])=>String(r[k]||"").toLowerCase().includes(q)));
  $("count").textContent=records.length;$("shown").textContent=filtered.length;
  $("records").innerHTML=filtered.length?filtered.map(r=>`
    <article class="record">
      <div class="meta">${esc(r.category||"未分類")}${r.model?" · "+esc(r.model):""}</div>
      <h3>${esc(r.name||"名称未設定")}</h3>
      ${r.spec?`<p><b>規格：</b>${esc(r.spec)}</p>`:""}
      ${r.compatible?`<p><b>互換品：</b>${esc(r.compatible)}</p>`:""}
      ${r.supplier?`<p><b>入手先：</b>${esc(r.supplier)}</p>`:""}
      ${r.notes?`<p>${esc(r.notes)}</p>`:""}
      <div class="links">${r.source?`<a href="${esc(r.source)}" target="_blank" rel="noopener noreferrer">出典を開く ↗</a>`:""}${r.model?`<span class="muted">型番・別名：${esc(r.model)}</span>`:""}</div>
      <div class="rec-actions"><button class="btn" data-edit="${esc(r.id)}">編集</button></div>
    </article>`).join(""):`<div class="empty"><div style="font-size:2rem">⌕</div><b>${q?"該当する情報がありません":"まだデータがありません"}</b><p>${q?"別のキーワードで検索してみてください。":"Excelファイルを取り込むか、右側のフォームから最初の情報を登録しましょう。"}</p></div>`;
  document.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>editRecord(b.dataset.edit)));
}
function clearForm(){ $("recordForm").reset();$("recordId").value="";$("formTitle").textContent="新しい情報を登録";$("deleteBtn").classList.add("hidden")}
function editRecord(id){const r=records.find(x=>x.id===id);if(!r)return; $("recordId").value=r.id;for(const [k] of FIELDS)$(k).value=r[k]||"";$("formTitle").textContent="情報を編集";$("deleteBtn").classList.remove("hidden");$("editorPanel").scrollIntoView({behavior:"smooth",block:"start"})}
$("recordForm").addEventListener("submit",e=>{e.preventDefault();const id=$("recordId").value;const r={id:id||uid()};for(const [k] of FIELDS)r[k]=$(k).value.trim();if(id){const i=records.findIndex(x=>x.id===id);if(i>=0)records[i]=r}else records.unshift(r);persist();clearForm();$("search").value="";});
$("newBtn").addEventListener("click",()=>{clearForm();$("name").focus();$("editorPanel").scrollIntoView({behavior:"smooth",block:"start"})});
$("clearBtn").addEventListener("click",clearForm);
$("deleteBtn").addEventListener("click",()=>{const id=$("recordId").value;if(id&&confirm("このデータを削除しますか？この操作は取り消せません。")){records=records.filter(r=>r.id!==id);persist();clearForm()}});
$("search").addEventListener("input",render);
$("excelFile").addEventListener("change",async e=>{
 const file=e.target.files[0];if(!file)return;
 try{
  if(!window.XLSX)throw new Error("Excel読込ライブラリを読み込めませんでした。インターネット接続を確認してください。");
  const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:"array"});const sheet=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(sheet,{defval:""});
  if(!rows.length)throw new Error("データ行が見つかりません。1行目を見出しにしてください。");
  const imported=rows.map(cleanRecord).filter(r=>r.name);
  if(!imported.length)throw new Error("「名称」列が見つからないか、名称が空です。");
  if(confirm(`${imported.length}件を取り込みます。既存データは残し、追加します。よろしいですか？`)){records=[...imported,...records];persist();alert(`${imported.length}件を追加しました。`)}
 }catch(err){alert("取込に失敗しました：\\n"+err.message)}finally{e.target.value=""}
});
function download(name,content,type){const blob=new Blob([content],{type});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
$("exportBtn").addEventListener("click",()=>{const header=FIELDS.map(x=>x[1]);const rows=records.map(r=>FIELDS.map(([k])=>r[k]||""));const csv=[header,...rows].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");download("msx-dictionary.csv","\\ufeff"+csv,"text/csv;charset=utf-8")});
$("backupBtn").addEventListener("click",()=>download("msx-dictionary-backup.json",JSON.stringify(records,null,2),"application/json;charset=utf-8"));
$("jsonFile").addEventListener("change",async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed))throw new Error("バックアップ形式が正しくありません");const next=parsed.map(cleanRecord).filter(r=>r.name);if(confirm(`${next.length}件のバックアップで現在のデータを置き換えますか？`)){records=next;persist();clearForm();alert("復元しました。")}}catch(err){alert("復元に失敗しました：\\n"+err.message)}finally{e.target.value=""}});
load();render();
</script>
</body>
</html>
